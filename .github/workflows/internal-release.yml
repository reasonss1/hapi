name: Internal Release

on:
    push:
        tags:
            - 'internal-*'
    workflow_dispatch:
        inputs:
            tag:
                description: Existing internal-* tag to build and release
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: internal-release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    release:
        # This personal channel must never publish into the upstream repository.
        if: github.repository == 'reasonss1/hapi'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        permissions:
            contents: write
        steps:
            - name: Resolve internal tag
              id: release
              env:
                  REQUESTED_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
                      tag="$REQUESTED_TAG"
                  else
                      [[ "$GITHUB_REF_TYPE" == tag ]]
                      tag="$GITHUB_REF_NAME"
                  fi
                  if [[ ! "$tag" =~ ^internal-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                      echo '::error::Expected an internal-* tag with only letters, digits, dots, underscores and hyphens.'
                      exit 1
                  fi
                  printf 'tag=%s\nref=refs/tags/%s\n' "$tag" "$tag" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.release.outputs.ref }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.4'
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Verify source identity
              env:
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  source_sha="$(git rev-parse HEAD)"
                  tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
                  [[ "$source_sha" == "$tag_sha" ]]
                  if [[ "$GITHUB_EVENT_NAME" == push && "$source_sha" != "$GITHUB_SHA" ]]; then
                      echo '::error::The tag no longer points at the triggering source commit.'
                      exit 1
                  fi
                  printf 'SOURCE_SHA=%s\nRELEASE_TAG=%s\n' "$source_sha" "$RELEASE_TAG" >> "$GITHUB_ENV"
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run build:single-exe
            - name: Smoke test Linux x64 executable
              run: |
                  cli/dist-exe/bun-linux-x64-baseline/hapi --version
                  cli/dist-exe/bun-linux-x64-baseline/hapi --help
            - name: Smoke test compiled Hub startup and authentication
              run: |
                  python - <<'PY'
                  import json, os, secrets, signal, socket, subprocess, tempfile, time
                  import urllib.error, urllib.request
                  from pathlib import Path

                  binary = Path('cli/dist-exe/bun-linux-x64-baseline/hapi').resolve()
                  with tempfile.TemporaryDirectory(prefix='hapi-compiled-hub-') as temporary:
                      home = Path(temporary)
                      token = secrets.token_urlsafe(32)
                      with socket.socket() as reservation:
                          reservation.bind(('127.0.0.1', 0))
                          port = reservation.getsockname()[1]
                      base = f'http://127.0.0.1:{port}'
                      environment = {**os.environ, 'HAPI_HOME': temporary, 'DB_PATH': str(home / 'hapi.db'),
                                     'CLI_API_TOKEN': token, 'HAPI_LISTEN_HOST': '127.0.0.1',
                                     'HAPI_LISTEN_PORT': str(port), 'HAPI_PUBLIC_URL': base}
                      opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
                      with (home / 'hub.log').open('wb') as log:
                          process = subprocess.Popen([str(binary), 'hub', '--no-relay'], env=environment,
                                                     stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                          try:
                              deadline = time.monotonic() + 60
                              while time.monotonic() < deadline:
                                  if process.poll() is not None:
                                      raise RuntimeError(f'Compiled Hub exited early with code {process.returncode}')
                                  try:
                                      with opener.open(base + '/health', timeout=1) as response:
                                          if response.status == 200 and json.load(response).get('status') == 'ok':
                                              break
                                  except (urllib.error.URLError, OSError, ValueError):
                                      pass
                                  time.sleep(0.25)
                              else:
                                  raise RuntimeError('Compiled Hub did not become healthy within 60 seconds')
                              remaining = deadline - time.monotonic()
                              if remaining <= 0:
                                  raise RuntimeError('Compiled Hub authentication deadline exceeded')
                              request = urllib.request.Request(base + '/api/auth', method='POST',
                                  data=json.dumps({'accessToken': token}).encode(),
                                  headers={'Content-Type': 'application/json'})
                              with opener.open(request, timeout=min(5, remaining)) as response:
                                  if response.status != 200 or not json.load(response).get('token'):
                                      raise RuntimeError('Compiled Hub authentication failed')
                              print('Compiled Hub startup, health and authentication passed')
                          except BaseException:
                              log.flush()
                              print((home / 'hub.log').read_text(errors='replace')[-6000:].replace(token, '[redacted]'))
                              raise
                          finally:
                              try:
                                  os.killpg(process.pid, signal.SIGTERM)
                              except ProcessLookupError:
                                  pass
                              try:
                                  process.wait(timeout=5)
                              except subprocess.TimeoutExpired:
                                  pass
                              try:
                                  os.killpg(process.pid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                              process.wait(timeout=5)
                  PY
            - name: Package Linux x64 binary, downloader and source manifest
              run: |
                  python - <<'PY'
                  import hashlib
                  import json
                  import os
                  import shutil
                  import tarfile
                  from datetime import datetime, timezone
                  from pathlib import Path

                  output = Path('cli/internal-release-artifacts')
                  output.mkdir(parents=True, exist_ok=False)
                  source = Path('cli/dist-exe/bun-linux-x64-baseline/hapi')
                  if not source.is_file() or source.stat().st_size == 0:
                      raise SystemExit(f'Missing or empty executable: {source}')
                  archive = output / 'hapi-linux-x64.tar.gz'
                  with tarfile.open(archive, 'w:gz') as package:
                      package.add(source, arcname='hapi')
                  with archive.open('rb') as stream:
                      archive_digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  artifacts = [{
                      'platform': 'linux',
                      'arch': 'x64',
                      'file': archive.name,
                      'sha256': archive_digest,
                      'binary': 'hapi',
                  }]
                  shutil.copyfile('scripts/download-internal.sh', output / 'download-internal.sh')
                  (output / 'download-internal.sh').chmod(0o755)
                  manifest = {
                      'schemaVersion': 1,
                      'repository': os.environ['GITHUB_REPOSITORY'],
                      'tag': os.environ['RELEASE_TAG'],
                      'commit': os.environ['SOURCE_SHA'],
                      'cliVersion': json.loads(Path('cli/package.json').read_text())['version'],
                      'builtAt': datetime.now(timezone.utc).isoformat(),
                      'artifacts': artifacts,
                  }
                  (output / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
                  checksums = []
                  for path in sorted(output.iterdir()):
                      with path.open('rb') as stream:
                          digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                      checksums.append(f'{digest}  {path.name}\n')
                  (output / 'checksums.txt').write_text(''.join(checksums))
                  PY
            - name: Publish personal prerelease after verifying all assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  python - <<'PY'
                  import json
                  import os
                  import subprocess
                  import urllib.error
                  import urllib.request
                  from pathlib import Path

                  repository = os.environ['GITHUB_REPOSITORY']
                  tag = os.environ['RELEASE_TAG']
                  source_sha = os.environ['SOURCE_SHA']
                  if repository != 'reasonss1/hapi':
                      raise SystemExit('This release channel is restricted to reasonss1/hapi')
                  base = f'https://api.github.com/repos/{repository}'
                  def api(path):
                      request = urllib.request.Request(base + path, headers={
                          'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                      })
                      try:
                          with urllib.request.urlopen(request, timeout=60) as response:
                              return json.load(response)
                      except urllib.error.HTTPError as error:
                          if error.code == 404:
                              return None
                          raise
                  def verify_tag():
                      commit = api('/commits/' + tag)
                      if not commit or commit['sha'] != source_sha:
                          raise SystemExit('Remote tag moved or disappeared; refusing to publish')
                  def find_release():
                      # The tag endpoint only promises published releases.
                      # Authenticated listings include drafts for this writer.
                      page = 1
                      while True:
                          releases = api(f'/releases?per_page=100&page={page}')
                          if releases is None:
                              raise SystemExit('Could not list releases')
                          for release in releases:
                              if release['tag_name'] == tag:
                                  return release
                          if len(releases) < 100:
                              return None
                          page += 1
                  def gh(*args):
                      subprocess.run(['gh', 'release', *args, '--repo', repository], check=True)

                  verify_tag()
                  release = find_release()
                  if release and not release['draft']:
                      raise SystemExit('Release is already public; create a new tag instead of replacing its assets')
                  if release is None:
                      notes = Path(os.environ['RUNNER_TEMP']) / 'internal-release-notes.md'
                      notes.write_text(
                          f'Personal HAPI internal build from `{source_sha}`.\n\n'
                          'Prebuilt Linux x64 CLI, Runner, Hub and web assets; no Bun or source checkout is needed on devices.\n\n'
                          'Download `hapi-linux-x64.tar.gz` and verify it using `checksums.txt`. '
                          '`download-internal.sh` downloads and verifies the Linux binary '
                          'without stopping services or changing the active installation.\n\n'
                          'Preserve device configuration and running sessions when activating the build. '
                          'This prerelease does not publish to npm or the upstream repository.\n'
                      )
                      # The verified tag already exists; do not ask the token
                      # to create another ref or resolve a different target.
                      gh('create', tag, '--draft', '--prerelease', '--verify-tag',
                         '--title', f'HAPI internal {tag}', '--notes-file', str(notes))
                  files = sorted(Path('cli/internal-release-artifacts').iterdir())
                  gh('upload', tag, *map(str, files), '--clobber')
                  release = find_release()
                  if release is None:
                      raise SystemExit('Draft release disappeared after uploading assets')
                  expected = {path.name: path.stat().st_size for path in files}
                  actual = {asset['name']: asset['size'] for asset in release['assets']}
                  if actual != expected:
                      raise SystemExit('Uploaded assets are incomplete or unexpected; leaving the release as a draft')
                  verify_tag()
                  gh('edit', tag, '--draft=false', '--prerelease', '--latest=false')
                  release = find_release()
                  if release is None or release['draft'] or not release['prerelease']:
                      raise SystemExit('Release did not become a prerelease')
                  print(release['html_url'])
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write(f"Published [{tag}]({release['html_url']}) from `{source_sha}`.\n")
                  PY
            - name: Verify real download from published Linux x64 prerelease
              run: |
                  set -euo pipefail
                  directory="$(mktemp -d "$RUNNER_TEMP/hapi-published-smoke.XXXXXXXX")"
                  sh scripts/download-internal.sh "$RELEASE_TAG" "$directory"
                  "$directory/$RELEASE_TAG/hapi" --help
                  DOWNLOADED_MANIFEST="$directory/$RELEASE_TAG/release-manifest.json" python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  manifest = json.loads(Path(os.environ['DOWNLOADED_MANIFEST']).read_text())
                  if manifest['commit'] != os.environ['SOURCE_SHA']:
                      raise SystemExit('The downloaded release does not match the source commit built by this workflow.')
                  print('Published Linux x64 download verified against source commit:', manifest['commit'])
                  PY
